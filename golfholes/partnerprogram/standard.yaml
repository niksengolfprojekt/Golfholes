# Partnernivåerna. Ett företag kan köpa en enskild produkt utan att köpa en nivå.
nivaer:
  hal:
    namn: Hålpartner
    text: Företaget är förknippat med ett eget hål.
  verksamhet:
    namn: Verksamhetspartner
    text: Företaget är förknippat med en del av anläggningen eller en verksamhet.
  huvud:
    namn: Huvudpartner
    text: Ett större samarbete med flera ytor och klubbens största vecka.

# Avtalsvillkor som gäller alla produkter (klubbens fil kan skriva över).
villkor:
  avtalslangd: [1, 3]                 # år
  treaarsfordel: "Priset är låst i tre år och ingen startkostnad."
  startkostnad_text: "Startkostnaden gäller ettårsavtal och täcker skylt och tryck."
  forsaljningsstart: "1 november"
  betalning: "Faktureras i mars. Treårsavtal faktureras ett år i taget."
  forstahandsratt: "Befintlig partner har förstahandsrätt till sin yta fram till 30 november inför nästa säsong."
  logotyp: "Logotypen visas i en färg, så att den håller ihop med klubbens skyltar och inlägg."
  godkannande: "Partnern godkänner allt material med logotypen innan det visas."
  flygfilm: "Flygfilmen ingår när den är färdig och godkänd av klubben. Den säljs inte som levererad dessförinnan."

# Partnerveckan: bara ytor som finns. Klubbens fil sätter veckorna och platserna.
partnervecka:
  ytor:
    - {namn: "Skylten vid entrén", text: "Partnerveckans skylt med företagets logotyp, där alla går in. Plattan byts måndag morgon.", tid_min: 5}
    - {namn: "Inlägget på måndagen", text: "”Veckans partner” i Instagram och Facebook, schemalagt i förväg.", tid_min: 0}
    - {namn: "Hemsidans startsida", text: "”Veckans partner” med logotyp och länk, byts automatiskt enligt kalendern.", tid_min: 0}
    - {namn: "Foto till rapporten", text: "Receptionen fotograferar skylten med mobilen och mejlar bilden till kansliet.", tid_min: 2}
    - {namn: "Erbjudande till medlemmarna", text: "Om partnern vill: ett erbjudande till klubbens medlemmar under veckan, i inlägget.", tid_min: 0}
  villkor:
    - {namn: "Klubbens skärm", text: "Partnerveckans bild i skärmens bildspel.", kraver: skarm}

# Klubbens arbetstid per år för hela programmet utöver produkterna (timmar).
administration:
  - {vad: "Säljmöten och avtal", tid_h_per_avtal: 2}
  - {vad: "Föra partneröversikten", tid_h: 4}
  - {vad: "Lämna ronder per månad till TACADA", tid_h: 1}
  - {vad: "Förnyelsesamtal", tid_h_per_avtal: 1}
