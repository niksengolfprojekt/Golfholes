# Alvesta Golfklubb – referensklubb (test av ny-klubb-flödet, Eric 2026-10-25: hål 1 och 10)
# Scorekort: alvestagolf.se/wp-content/uploads/2026/06/Scorekort-Alvesta-GK.pdf (juni 2026), hämtat 2026-10-25.
# Webbsidans tabell (alvestagolf.se/scorekort) har samma längder men annat index på hål 10–18 (t.ex. hål 10 index 9
# på webben, 7 i PDF:en) – PDF:en är nyare och används. Fråga klubben.
club: Alvesta Golfklubb
web: https://alvestagolf.se
contact: kansli@alvestagolf.se, 0472-401 40
stil: A              # stil A (kvällsljus) tills klubben valt
layout: 3
kortnamn: Alvesta GK
filnamn: Alvesta
bana: Kronobergshed
# Vad klubben har köpt (python -m golfholes paket klubbar/alvesta): inget än – referensklubb inför ett möte.
paket:
  avtal: "Referensklubb, Eric 2026-10-25 (inget avtal)"
  produkter: [halguide]
  hal: [1, 10]
tees: [{namn: "63", farg: vit}, {namn: "59", farg: gul}, {namn: "54", farg: bla}, {namn: "49", farg: rod}, {namn: "40", farg: orange}]
bbox_sweref99tm: {e_min: 472600, n_min: 6312600, e_max: 474950, n_max: 6314950}   # grov ruta runt klubbens adress (golf.se 56.9682, 14.5703), krymps när banan är hittad

