# Glasrikets Golfklubb – pilotklubb
club: Glasrikets Golfklubb
web: https://www.glasriketsgk.se
contact: info@glasriketsgk.se, 0470-653 20
stil: foto           # hålbildens stil. Nya klubbar: Akvarell, Sommarakvarell, Gravyr, Mjuk 3D, Arkitektskiss
                     # eller Papperssnitt. Glasriket har sin egen fotostil (standardprompten i docs/halproduktion.md).
layout: 1            # hålkortets layout: 1 Hålkort (spikad), 2 Poster, 3 Mörk, 4 Skärm, 5 Banguide, 6 Sponsorhål
typsnitt: {siffror: Spectral, text: Hanken Grotesk}   # Glasrikets profil "Glas och skog" (förslag v0)
caddee: false   # finns inte på caddee.se/anslutna-klubbar (2026-10-11)

# Banans yta med 100 m marginal, SWEREF 99 TM (EPSG:3006).
# Underlag från OpenStreetMap (relation 2715292). Ladda ner detta område från Geotorget.
bbox_sweref99tm:
  e_min: 491366
  n_min: 6305290
  e_max: 492427
  n_max: 6306850

lantmateriet:
  status: hämtat i molnet 2026-10-19 med hamta (utsnitt i projektmappen glasriket/lantmateriet/)
  # Hämtas med `python -m golfholes hamta klubbar/glasriket` (kräver Geotorget-inloggning i molnmiljön)
  ortofoto: o63050_4900_25_mr25.tif     # orto-e2-2025, fotograferat 2025-07-01, 16 cm
  markhojdmodell: m630_49.tif           # 1 m, laserskannat 2026-03-09/10, 169,9–205,7 m ö.h. inom banan

