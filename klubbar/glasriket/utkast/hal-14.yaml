# Fröpunkter för hål 14 (SWEREF 99 TM, meter). Satta mot ortofoto 2025-07-01 och klubbens
# hålkarta (banguide 2025). Hålet spelas från norr mot söder och svänger höger (väster)
# mot greenen nära hål 15:s tee; bunkern kort om höger om greenen syns på fotot.
#   python -m golfholes utkast klubbar/glasriket/utkast/hal-14.yaml
