hole: 14
par: 4
index: 1
orto: data/glasriket/orto/o63050_4900_25_mr25.tif
# Tees i den smala gången i skogen: 52/49/44 = den runda klippta ytan, 56 och 60 bakom
# (60 ska ligga 34 m bakom 56 enligt klubbens karta). Bekräftas av klubben.
