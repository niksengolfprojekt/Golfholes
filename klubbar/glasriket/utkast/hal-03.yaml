# Fröpunkter för hål 3 (SWEREF 99 TM, meter). Satta mot ortofoto 2025-07-01 och klubbens
# hålkarta (banguide 2025, glasriketsgk.se/haloversikt). Resten av formerna tar koden ur fotot:
#   python -m golfholes utkast klubbar/glasriket/utkast/hal-03.yaml
club: Glasrikets Golfklubb
hole: 3
par: 4
index: 16
orto: data/glasriket/orto/o63050_4900_25_mr25.tif
# Tees: utmärkta av Eric 2026-10-21 på hålkortet: 52/56/60 vid gångvägen strax bakom 49,
# 49 = den ovala, klippta teen närmare dammen.
# 44 syns INTE på fotot – punkten är en gissning nära gångvägen och måste bekräftas av klubben.
tees:
- {name: 52/56/60, point: [491537.7, 6305905.0], length_m: 290}
- {name: '49', point: [491557.2, 6305890.9], length_m: 274}
- {name: '44', point: [491621.7, 6305850.2], length_m: 199}
# Spellinje räknas fram: bakre tee → fairwayns tyngdpunkt → greenens mitt → bakkant.
centerline: auto
green: [491715.1, 6305712.0]
fairway:
- [491653.5, 6305800.7]
- [491710.0, 6305774.8]
# Greenen ligger delvis i trädskugga på fotot, så trollstaven blöder ut i förgreenen.
# Kanten är därför inritad ur fotot (ljusa ovalen innanför kragen); nedre vänstra
# kanten ligger i skugga och följer ovalens form.
green_polygon:
