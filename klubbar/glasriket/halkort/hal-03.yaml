# Hålkort för Glasriket hål 3 – TYPBILD, test att mallen går att upprepa på ett andra hål.
# Fakta från klubb.yaml (klubbens hålkarta) och förslaget till klubben (nya bunkrar i höst).
# Bilden är AI-genererad efter hålkartans beskrivning: formen, dammen och bunkrarna är INTE exakta.
# Spelråden är UTKAST – ska skrivas eller granskas av klubbens pro innan något visas för klubben.
club: Glasrikets Golfklubb
bana: Fylleryd
hole: 3
par: 4
index: 16
tees: [["52 · 56 · 60", 290], ["49", 274], ["44", 199]]
bild: ../typbilder/hal-03.webp
typbild: true
rubrik: Kort par 4 med dammen
beskrivning: >-
  Nästan rakt och kort, med en svag vänsterböj in mot greenen. Dammen till höger syns redan
  från tee 49 och fångar den som slår för långt åt höger. Bunkrarna vid greenen är nybyggda i höst.
rad_rubrik: Råd från pro:n
rad:
  - Driver behövs inte. Ett järn eller en hybrid från tee, siktat mot vänstra halvan av fairway, håller bollen borta från dammen.
  - Då återstår ett kort inspel. Sikta på mitten av greenen, oavsett var flaggan står.
  - Hålet är ett av banans lättaste på index. Här finns en birdiechans.
slutrad: Spela säkert från tee, attackera med inspelet.
strategi:
  sakert: Järn eller hybrid mot vänstra halvan av fairway, kort inspel mot mitten av greenen.
  chansa: Driver förbi dammen för ett wedgeinspel. Ett slag åt höger hamnar i vattnet.
