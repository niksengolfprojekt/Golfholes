rubrik: Banans svåraste utslag
beskrivning: >-
  Ett smalt dogleg höger genom granskogen. Out längs hela vänstersidan, skog till höger
  och en bunker som vaktar greenen kort om höger. Här vinns och förloras rundan.
rad_rubrik: Råd från pro:n
rad:
  - Den långtslående genar över skogen mot greenen och får ett kort inspel.
  - Medelgolfaren ska inte utmana här – det är out till vänster och skog till höger.
slutrad: Spela hålet som ett par fem för säkerhets skull.
strategi:
  sakert: Spela hålet som ett par fem – utslag till fairway, fram mot greenen och ett kort inspel förbi bunkern.
  chansa: Gena över skogen till höger mot greenen. Out längs hela vänstersidan om det går snett.
