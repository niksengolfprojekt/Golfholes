beskrivning: >-
  Ett smalt dogleg höger genom granskogen. Out längs hela vänstersidan, skog till höger
  och en bunker som vaktar greenen kort om höger. Här vinns och förloras rundan.
rad_rubrik: Råd från pro:n
rad:
  - Från tee 52 är det 290 meter till greenens mitt, och hålet svänger höger efter knappt 150 meter.
  - Bunkern ligger kort om höger om greenen. Inspel från vänstra halvan av fairway har fri väg in.
slutrad: En bogey på index 1 är inget att skämmas för.
strategi:
  sakert: Utslag till vänstra halvan av fairway och ett inspel som går fri från bunkern.
  chansa: Gena över skogen till höger mot greenen. Out längs hela vänstersidan om det går snett.
