typbild: false
rubrik: Banans svåraste hål
beskrivning: >-
  Ett smalt dogleg höger genom björkskogen i Fylleryd. Out längs hela vänstersidan,
  skog till höger och en bunker som vaktar greenen kort om höger. Här vinns och förloras rundan.
rad_rubrik: Råd från pro:n
rad:
  - Siktet från tee är den 2,5 meter höga enen i högra skogskanten. Slå över den så ligger du bra till på fairway.
  - Långtslående kan gena över skogen mot green och lämna sig ett kort inspel – men det kräver ett perfekt utslag.
  - "Medelgolfaren ska inte ta den chansen. Spela hålet som ett par fem: utslag mot enen, ett andraslag fram mot greenen och ett kort inspel förbi bunkern."
slutrad: En bogey på index 1 är inget att skämmas för.
strategi:
  sakert: Utslag mot enen, ett andraslag fram mot greenen och ett kort inspel förbi bunkern.
  chansa: Gena över skogen mot green. Kräver ett perfekt utslag – out längs hela vänstersidan.
