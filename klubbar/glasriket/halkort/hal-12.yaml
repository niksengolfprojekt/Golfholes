# Hålkort för Glasriket hål 12. Hålbilden är AI-målad på hålets exakta form ur Lantmäteriets
# ortofoto; träd ur Laserdata Skog (python -m golfholes aiunderlag / aibild).
# Råden är klubbens egna "Råd från PRO:n" (glasriketsgk.se/haloversikt, hämtad 2026-10-20),
# lätt redigerade. Beskrivning och strategi är Claudes utkast ur hålfilen – klubben godkänner.
# Tee 60 syns inte på fotot och tee 56 ligger i trädskugga – klubben bekräftar. Kartan visar en
# bunker vänster om greenen, fotot två. Bunkern höger i bild hör till hål 13.
club: Glasrikets Golfklubb
bana: Fylleryd
hole: 12
par: 5
index: 3
tees: [["60", 527], ["56", 490], ["52 · 49 · 44", 400]]
bild: ../halbilder/hal-12-malad.webp
typbild: false
rubrik: Kräver ett bra utslag
beskrivning: >-
  En lång par 5 norrut i en skogsgata. De sista 100 m smalnar fairway av och svänger
  svagt vänster mot en stor oval green med två bunkrar vänster fram.
rad_rubrik: Råd från pro:n
rad:
  - En lång par femma som kräver ett bra utslag.
  - Ta gärna ett lite längre tredjeslag, för framme vid green är det väldigt smalt.
slutrad: Stor och snäll green.
strategi:
  sakert: Tre raka slag – lägg andra slaget så att du har ett fullt slag in genom det smala partiet.
  chansa: Två långa slag tar dig nära, men framme vid green är det smalt med bunkrar vänster.
