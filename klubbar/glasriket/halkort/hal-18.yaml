# Hålkort för Glasriket hål 18. Hålbilden är AI-målad på hålets exakta form ur Lantmäteriets
# ortofoto; träd ur Laserdata Skog (python -m golfholes aiunderlag / aibild).
# Råden är klubbens egna "Råd från PRO:n" (glasriketsgk.se/haloversikt, hämtad 2026-10-20),
# lätt redigerade. Beskrivning och strategi är Claudes utkast ur hålfilen – klubben godkänner.
club: Glasrikets Golfklubb
bana: Fylleryd
hole: 18
par: 4
index: 9
tees: [["60", 423], ["56", 383], ["52 · 49", 325], ["44", 270]]
bild: ../halbilder/hal-18-malad.webp
typbild: false
rubrik: Precision från tee
beskrivning: >-
  Ett par 4 norrut hem mot klubbhuset. Två fairwaybunkrar ligger cirka 225–250 m från
  tee 60, och bakom den svagt frånlutande greenen ligger övningsgreenen.
rad_rubrik: Råd från pro:n
rad:
  - Placera gärna ditt utslag hitom bunkrarna för att inte tappa längd.
  - Andra slaget är ganska långt, till en svagt frånlutande green.
slutrad: Flyer från ruffen kan gå över greenen – där är marken hård.
strategi:
  sakert: Utslag kort om bunkrarna, sedan ett långt järn in mot greenens framkant.
  chansa: Över bunkrarna ger ett kortare inspel, men bunkrarna tar längd om du missar.
