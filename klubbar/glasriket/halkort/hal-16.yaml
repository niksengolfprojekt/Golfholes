slutrad: "Snäll green."
kortrad: "En lätt fade på 170 meter – och slå bara när lampan är släckt."   # pro:ns råd i en mening (prospekt och inlägg)
strategi:
  sakert: Ett kontrollerat utslag på 170 m till fairway och ett kort inspel mot mitten av greenen.
  chansa: Spela mot flaggan även när den står till vänster – men kort eller vänster väntar vattnet.
