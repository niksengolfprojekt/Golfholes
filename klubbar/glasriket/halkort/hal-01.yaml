# Hålkort för Glasriket hål 1. Hålbilden är AI-målad på hålets exakta form ur Lantmäteriets
# ortofoto; träd ur Laserdata Skog (python -m golfholes aiunderlag / aibild).
# Råden är klubbens egna "Råd från PRO:n" (glasriketsgk.se/haloversikt, hämtad 2026-10-20),
# lätt redigerade. Beskrivning och strategi är Claudes utkast ur hålfilen – klubben godkänner.
# Tee 56/60 ligger på klippta ytan vid klubbhuset; exakt plats inom ytan bekräftas av klubben.
club: Glasrikets Golfklubb
bana: Fylleryd
hole: 1
par: 5
index: 12
tees: [["56 · 60", 442], ["52 · 49", 394], ["44", 303]]
bild: ../halbilder/hal-01-malad.webp
typbild: false
rubrik: Ett bra öppningshål
beskrivning: >-
  En par 5 från klubbhuset mot sydväst som svänger vänster runt två dammar på högersidan,
  cirka 250–325 m från tee 56/60. Greenen har en bunker till höger.
rad_rubrik: Råd från pro:n
rad:
  - Relativt kort och bra öppningshål. Outgräns både på vänster- och högersidan.
  - Andra slaget bör placeras på höger sida, då ger du dig ett ganska kort inspel mot en svagt ifrånsluttande green.
slutrad: Vänsterkanten ger dig medstuds.
strategi:
  sakert: Utslag mitt i fairway, andra slaget förbi dammarna ut till höger sida – kvar blir ett kort inspel.
  chansa: Långtslående kan nå greenen på två, men dammarna och out på båda sidor straffar ett snett slag.
