    - {namn: Senior utan spelrätt, villkor: från 22 år, pris: 8200, ingar: "Medlemsavgift 995 kr, spelavgift 7 005 kr, aktivitetsavgift 200 kr. Tre samtida bokningar."}
    - {namn: Långboende, villkor: minst 10 mil bort, pris: 4300, ingar: "Medlemsavgift 995 kr, spelavgift 3 305 kr. En samtida bokning."}
    - {namn: Studerande, villkor: "heltidsstuderande vid högskola eller universitet, intyg krävs", pris: 4100, ingar: "Medlemsavgift 995 kr, spelavgift 2 905 kr, aktivitetsavgift 200 kr. En samtida bokning."}
    - {namn: Junior, villkor: 17–21 år, pris: 3450, ingar: "Medlemsavgift 995 kr, spelavgift 2 355 kr, aktivitetsavgift 100 kr. En samtida bokning."}
    - {namn: Yngre junior, villkor: 12–16 år, pris: 2600, ingar: "Medlemsavgift 995 kr, spelavgift 1 505 kr, aktivitetsavgift 100 kr. En samtida bokning."}
    - {namn: Knattegolf, villkor: 0–11 år, pris: 1100, ingar: "Medlemsavgift 600 kr, spelavgift 500 kr. En samtida bokning."}
    - {namn: 12-hålsbanan utan spelrätt, villkor: Pay & Play, pris: 3500, ingar: "Medlemsavgift 995 kr, spelavgift 2 305 kr, aktivitetsavgift 200 kr. En personlig greenfeebiljett till 18-hålsbanan via Min Golf. En samtida bokning."}
    - {namn: 12-hålsbanan med spelrätt, villkor: Pay & Play, pris: 2900, ingar: "Medlemsavgift 995 kr, spelavgift 1 705 kr, aktivitetsavgift 200 kr. Två personliga greenfeebiljetter till 18-hålsbanan via Min Golf. En samtida bokning."}
    - {namn: Greenfeemedlemskap, villkor: 20 % rabatt på ordinarie greenfee, pris: 995, ingar: "Aktivt medlemskap: spela greenfee på alla banor, träna på klubbens övningsområden och var med i klubbens verksamhet. En samtida bokning."}
  delbetalning: Vill du dela upp betalningen går det att betala med autogiro i åtta delbetalningar.
  friskvard: Friskvårdsbidrag kan sökas för spelavgiften.
  aktivitet: Aktivitetsavgiften betalas tillbaka efter fyra timmars arbete vid någon av klubbens aktiviteter, eller om du är golfvärd vid ett tillfälle.
  spelratt: >-
    En spelrätt ger reducerad spelavgift varje år. Den kan köpas av klubben för 7 750 kr eller av en medlem
    som vill sälja, till ett pris ni kommer överens om.
