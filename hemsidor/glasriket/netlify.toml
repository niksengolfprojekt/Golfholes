# Netlify: publicera mappen public/ som den är (ingen byggkörning hos Netlify – bygget görs med bygg.py
# och resultatet checkas in). Formulären (medlemsansökan, hålsponsor) tas emot av Netlify Forms;
# ställ in e-postavisering till info@glasriketsgk.se under Forms → Notifications.
# I Netlify: Base directory = hemsidor/glasriket.
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
