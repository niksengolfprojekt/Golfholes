      - Klubbens sigill "Småland"
      - Hål 14, banans svåraste utslag
      - Dammarna vid hål 17
      - Nya bunkrar 2025 på hål 4, 7 och 13
    ide: null
    riktning: standardmall
    toppbild: helbild-med-rubrik
    typsnitt: {rubrik: Spectral, text: Hanken Grotesk}
    palett: {huvud: "#10202E", ljus: "#EEF3EC", accent: "#D9A441", ovriga: ["#1D4756", "#3F7F86", "#9CC9C3"]}
    halbildstil: målad (Glas och skog, mörk bakgrund)
    halkortslayout: 3
    rorelse: ingen
    designfil: null
    anteckning: >
      Mätt kontroll 2026-10-25: 7 fel (småetiketter över rubriker, textskugga, tunna linjer,
      ramade rutor, text under 13 px, 16 textstorlekar, ingen rörelse). Typsnitt, färger och
      inventering behålls; riktning och toppbild väljs om.
