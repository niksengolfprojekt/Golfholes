    palett: {huvud: "#183329", ljus: "#F3EDE2", accent: "#B7955E", ovriga: ["#571F30", "#101F2B"]}
    halbildstil: blandat (visar alla sex stilar)
    halkortslayout: null
    rorelse: ej-bedomd
    designfil: tacada/grafisk-profil (manual v1.2 i projektmappen)
    anteckning: Riktning och toppbild fylls i efter mätt kontroll + smakgranskning.

  - id: glasriket
    namn: Glasrikets Golfklubb
